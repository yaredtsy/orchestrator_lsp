[package]
name = "spike-driver-python"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
lsp-server = "0.10.0"
pylspt = { version = "0.1.0", path = "../../../../pylspt" }
serde = "1.0.229"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The same vendored crates pylspt uses (same paths = same crate instances).
# FINDING (S2): pylspt re-exports none of these, so the adapter has to name ruff crates.
# A small `pylspt::facade` (open project, outline(file), call_tree(...)) would remove this.
ruff_db = { path = "../../../../pylspt/vendor/ruff/crates/ruff_db", default-features = false, features = ["os"] }
ty_project = { path = "../../../../pylspt/vendor/ruff/crates/ty_project", default-features = false, features = ["zstd"] }
ruff_source_file = { path = "../../../../pylspt/vendor/ruff/crates/ruff_source_file" }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
